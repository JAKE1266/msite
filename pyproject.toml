[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msite"
version = "1.0.1"
description = "msite —— 把一个目录的 Markdown 构建成带侧边导航与主题的静态文档站(私有内嵌 mdown)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "JAKE1266" }]
keywords = ["markdown", "static-site", "documentation", "generator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
Homepage = "https://github.com/JAKE1266/msite"
Issues = "https://github.com/JAKE1266/msite/issues"

[project.scripts]
msite = "msite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
